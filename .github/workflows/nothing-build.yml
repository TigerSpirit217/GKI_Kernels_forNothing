      # END NOTHING VERSION MENU
      ksu_variant:
        description: KernelSU 变体（SukiSU 为上游最新版，41013 为可选固定版本）
        type: choice
        options: [None, Official, SukiSU, BakaSU, 'SukiSU(41013)']
        default: None
      version_name:
        description: 自定义版本后缀（可选，例如 Tig，生成 基础版本-Android-KMI-Tig；留空仅基础版本-Android-KMI）
        type: string
        default: ''
      build_time:
        description: 构建时间（可选，例如 2026-10-19 12:30:00 UTC；留空使用当前 UTC）
        type: string
        default: ''
      enable_susfs:
        description: 启用 SUSFS（需要 KernelSU）
        type: boolean
        default: false
      use_kpm:
        description: KPM 模块支持（需要 SukiSU / BakaSU）
        type: boolean
        default: false
      droidspaces:
        description: Droidspaces 容器支持
        type: boolean
        default: false
      droidspaces_slot:
        description: Droidspaces 兼容槽位（保留默认 678 即可）
        type: choice
        options: ['678', '123', '345']
        default: '678'
      droidspaces_ntsync:
        description: NTSync（同时自动启用 Droidspaces）
        type: boolean
        default: false
      use_zram:
        description: ZRAM 增强
        type: boolean
        default: false
      use_bbg:
        description: BBG 防格机
        type: boolean
        default: false
      use_rekernel:
        description: Re-Kernel
        type: boolean
        default: false
      use_nomount:
        description: NoMount
        type: boolean
        default: false
      use_networking:
        description: 网络增强
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: CVE-2026-43499 修复
        type: boolean
        default: false
      export_susfs_patches:
        description: 导出 SUSFS 集成补丁（需启用 SUSFS 及 SukiSU / BakaSU）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nothing-${{ github.ref }}-${{ inputs.model }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  nothing:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      MANAGER_STR: ${{ vars.MANAGER_STR }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Nothing 适配层依赖
        run: python -m pip install -r nothing/requirements.txt

      - name: 整理用户补丁选项
        if: inputs.operation == 'build'
        env:
          BUILD_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python -m nothing.form

      - name: 列出所有分支的官方版本提交
        if: inputs.operation == 'list-versions'
        env:
          MODEL: ${{ inputs.model }}
        run: python -m nothing.source --model "$MODEL" --list-versions > nothing-versions.json

      - name: 上传版本目录
        if: inputs.operation == 'list-versions'
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-official-versions
          path: nothing-versions.json
          if-no-files-found: error

      - name: 为内核源码和编译产物准备磁盘空间
        if: inputs.operation == 'build'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$GITHUB_WORKSPACE"

      - name: 定位发布提交并拉取 NothingOSS 源码
        if: inputs.operation == 'build'
        id: source
        env:
          MODEL: ${{ inputs.model }}
          VERSION: ${{ inputs.version }}
        run: python -m nothing.source --model "$MODEL" --version "$VERSION" --menu --settings nothing-settings.json

      - name: 从原工作流生成补丁步骤
        if: inputs.operation == 'build'
        id: adapter
        run: python -m nothing.upstream --options nothing-options.json

      - name: 安装编译依赖
        if: inputs.operation == 'build'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev device-tree-compiler lz4 zstd rsync curl git zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5 libtinfo5

      - name: 复用上游补丁流程
        if: inputs.operation == 'build'
        uses: ./.nothing-actions
        with:
          context: ${{ steps.adapter.outputs.context }}

      - name: 拒绝不完整补丁
        if: inputs.operation == 'build'
        run: |
          python -m nothing.sukisu verify
          python -m nothing.verify rejects

      - name: 缓存官方 Clang
        if: inputs.operation == 'build'
        uses: actions/cache@v4
        with:
          path: nothing-clang
          key: nothing-clang-${{ runner.os }}-${{ steps.source.outputs.clang_version }}-v1

      - name: 编译 Nothing 内核
        if: inputs.operation == 'build'
        run: exec python -m nothing.run --timeout 7200 --grace 3 -- bash nothing/build.sh

      - name: 打包设备专用 AnyKernel3
        if: inputs.operation == 'build'
        run: python -m nothing.package

      - name: 上传 AnyKernel3 ZIP 与校验值
        if: inputs.operation == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-${{ steps.source.outputs.device_id }}-${{ steps.source.outputs.source_sha }}-AnyKernel3
          path: out/nothing/*
          if-no-files-found: error
          compression-level: 0

      - name: 收集补丁冲突
        if: ${{ always() && inputs.operation == 'build' }}
        shell: bash
        run: |
          mkdir -p build-logs
          if [ -d nothing-kernel/common ]; then
            find nothing-kernel -name '*.rej' -type f -exec cp --parents '{}' build-logs/ \;
          fi

      - name: 上传构建清单与诊断
        if: ${{ always() && inputs.operation == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: Nothing-build-diagnostics-${{ github.run_id }}
          path: |
            nothing-plan.json
            nothing-options.json
            nothing-settings.json
            .nothing-actions/action.yml
            build-logs/
            susfs-patch/
          if-no-files-found: warn
