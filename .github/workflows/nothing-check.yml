name: Nothing 适配层检查
on:
  push:
    paths: ['nothing/**', 'tests/**', '.github/workflows/nothing-*.yml', '.github/workflows/build.yml', '.github/workflows/kernel-custom.yml', '.github/workflows/kernel-ttl.yml', 'scripts/susfs_fixes/**', 'scripts/ttl_patch.py']
  pull_request:
    paths: ['nothing/**', 'tests/**', '.github/workflows/nothing-*.yml', '.github/workflows/build.yml', '.github/workflows/kernel-custom.yml', '.github/workflows/kernel-ttl.yml', 'scripts/susfs_fixes/**', 'scripts/ttl_patch.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r nothing/requirements.txt
      - run: python -m unittest discover -s tests/nothing -v
      - run: python -m unittest discover -s tests -p test_ttl_patch.py -v
      - run: python -m nothing.catalog --check
      - run: |
          bash -n nothing/build.sh
          bash -n nothing/anykernel.sh.in
